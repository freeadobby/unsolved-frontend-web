<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout.html}">
<div th:fragment="historyFragment">
    <div style="width:1300px; height:100px; background-color:skyblue"></div>
    <div class="container d-flex align-items-center">
        <img class="rounded-circle me-1"
             width="150"
             height="150"
             src="https://avatars.githubusercontent.com/u/137270898?s=96&v=4"
             alt
             style="position:relative; left:50px; bottom:40px">
        <p class="fw-bold"
           style="position:relative; left:70px; bottom:20px; font-size:35px">홍길동</p>
        <p class="fw-bold"
           style="position:relative; right:30px; top:10px">Diamond I(대충 임시티어)</p>
        <div class="progress" style="position:relative; width:50%; right:220px; top:30px; height:25px">
            <div class="progress-bar"
                 role="progressbar"
                 aria-valuenow=""
                 aria-valuemin="0"
                 aria-valuemax="100"
                 style="width:50%">50%</div>
        </div>
    </div>
    <div class="d-flex gap-5 justify-content-center py-3" style="border-bottom: 3px solid lightgray">
        <a href="/user/myPage" class="text-decoration-none fw-bold" style="color:black">오늘의 학습목록</a>
        <a href="/user/myPage/solved" class="text-decoration-none fw-bold" style="color:black">문제</a>
        <a href="/user/myPage/history" class="text-decoration-none fw-bold"
           style="color:black; border-bottom: 3px solid black">히스토리</a>
        <a href="/user/myPage/overView" class="text-decoration-none fw-bold" style="color:black">개요</a>
        <a href="#" class="text-decoration-none fw-bold" style="color:black">내가 쓴 글</a>
    </div>

    <p style="height:30px"></p>

    <div class="card fw-bold p-4">
        <p style="font-size:20px">푼 문제 수</p>

        <div>
            <canvas id="myChart"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <script>
            const ctx = document.getElementById('myChart');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
                    datasets: [{
                        label: '# of SolvedProblem',
                        data: [5, 10, 10, 15, 24, 27, 27, 30, 40, 50, 60, 100],
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        </script>

    </div>

</div>
</html>
