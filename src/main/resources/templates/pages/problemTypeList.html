<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout.html}">
<div layout:fragment="content">
  <div class="p-2" style="width:100%; height:5%; background-color:gray">
    <span class="fw-bold" style="font-size:30px;color:white">
      유형별 문제 목록<span style="font-size: 20px"> #[[${typeName}]]</span>
    </span>
  </div>
  <table class="mt-3" style="width:100%; text-align: center">
    <tr class="container" style="border-bottom:2px lightgray solid">
      <th style="width:10%">티어</th>
      <th style="width:10%">#</th>
      <th style="width:55%">제목</th>
      <th style="width:5%">Tag</th>
      <th style="width:15%">푼 사람 수</th>
    </tr>

    <tr th:each="problem:${problemDetailList.problemList}" style="border-bottom:2px lightgray solid">
      <td>
        <span th:if="${problem.tier} == 0">Unrated</span>
        <span th:if="${problem.tier} >= 1 and ${problem.tier} <= 5">Cooper</span>
        <span th:if="${problem.tier} >= 6 and ${problem.tier} <= 10">Bronze</span>
        <span th:if="${problem.tier} >= 11 and ${problem.tier} <= 15">Silver</span>
        <span th:if="${problem.tier} >= 16 and ${problem.tier} <= 20">Gold</span>
        <span th:if="${problem.tier} >= 21 and ${problem.tier} <= 25">Platinum</span>
        <span th:if="${problem.tier} >= 26 and ${problem.tier} <= 30">Emerald</span>
        <span th:if="${problem.tier} >= 31 and ${problem.tier} <= 35">Diamond</span>
        <span th:if="${problem.tier} % 5 == 1">V</span>
        <span th:if="${problem.tier} % 5 == 2">IV</span>
        <span th:if="${problem.tier} % 5 == 3">III</span>
        <span th:if="${problem.tier} % 5 == 4">II</span>
        <span th:if="${problem.tier} % 5 == 0 and ${problem.tier} != 0">I</span>
      </td>
      <td><a href="#" class="text-decoration-none"
             style="color:black">[[${problem.id}]]</a></td>
      <td><a href="#" class="text-decoration-none"
             style="color:black">[[${problem.title}]]</a></td>
      <td class="dropdown">
        <button class="btn btn-primary dropdown-toggle" type="button"
                data-bs-toggle="dropdown" aria-expanded="false">Click</button>
        <div class="dropdown-menu p-4 text-muted" style="max-width: 200px;">
          <p th:each="tag:${problem.tags}">#[[${tag.name}]]</p>
        </div>
      </td>
      <td>[[${problem.acceptedUserCount}]]</td>
    </tr>
  </table>
</div>
</html>
