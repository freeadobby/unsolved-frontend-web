<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout.html}">
    <div layout:fragment="content">
        <h5 class="my-3 border-bottom pb-2">글쓰기</h5>
        <form th:action="@{/community/create}" th:object="${questionForm}" method="post">
            <div class="row mb-2">
                <div class="col-4 mb-3">
                    <label for="problemId" class="form-label">문제 번호</label>
                    <input type="text" name="problemId" id="problemId"
                           class="form-control" placeholder="#을 제외해주세요." th:field="*{problemId}">
                </div>
                <div class="col-4 mb-3">
                    <p class="mb-2">태그</p>
                    <select class="form-select" aria-label="Default select example"
                            th:field="*{Tag}" th:value="*{Tag}">
                        <option selected th:value="유형" disabled>글 유형</option>
                        <option value="질문" th:value="질문">#질문</option>
                        <option value="풀이" th:value="풀이">#풀이</option>
                        <option value="기타" th:value="기타">#기타</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label for="subject" class="form-label">제목</label>
                <input type="text" name="subject" id="subject"
                       class="form-control" th:field="*{subject}">
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">내용</label>
                <textarea name="content" id="content"
                          class="form-control" rows="10" th:field="*{content}"></textarea>
            </div>
            <input type="submit" value="게시" class="btn btn-primary my-2">
        </form>

    </div>
</html>
