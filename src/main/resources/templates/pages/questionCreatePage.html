<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout.html}">
    <div layout:fragment="content">
        <h5 class="my-3 border-bottom pb-2">글쓰기</h5>
        <form th:action="@{/community/create}" method="post">
            <div class="row mb-2">
                <div class="col-4 mb-3">
                    <label for="problemId" class="form-label">문제 번호</label>
                    <input type="text" name="problemId" id="problemId" class="form-control" placeholder="#을 제외해주세요.">
                </div>
                <div class="col-4 mb-3">
                    <p class="mb-2">태그</p>
                    <select class="form-select" aria-label="Default select example">
                        <option selected>글 유형</option>
                        <option value="1">#질문</option>
                        <option value="2">#풀이</option>
                        <option value="3">#기타</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label for="subject" class="form-label">제목</label>
                <input type="text" name="subject" id="subject" class="form-control">
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">내용</label>
                <textarea name="content" id="content" class="form-control" rows="10"></textarea>
            </div>
            <input type="submit" value="게시" class="btn btn-primary my-2">
        </form>

    </div>
</html>
